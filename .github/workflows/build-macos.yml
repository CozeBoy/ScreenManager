name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build app bundle
        run: bash build_app.sh

      - name: Build and verify DMG
        run: bash build_dmg.sh

      - name: Upload app and DMG
        uses: actions/upload-artifact@v6
        with:
          name: Screen-Manager-macOS
          path: |
            build/屏幕管理.app
            build/屏幕管理.dmg
          if-no-files-found: error
