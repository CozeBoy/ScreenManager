name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "填写版本标签（如 v1.0.0）以构建并发布 Release；留空只构建"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build app bundle
        run: bash build_app.sh

      - name: Build and verify DMG
        run: bash build_dmg.sh

      - name: Upload app and DMG
        uses: actions/upload-artifact@v6
        with:
          name: Screen-Manager-macOS
          path: |
            build/屏幕管理.app
            build/屏幕管理.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: Screen-Manager-macOS
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          TARGET: ${{ github.sha }}
        run: >-
          gh release create "$VERSION" "release-assets/屏幕管理.dmg"
          --repo "$REPOSITORY"
          --title "$VERSION"
          --target "$TARGET"
          --generate-notes
