name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "填写版本标签（如 v1.0.0）以构建并发布 Release；留空只构建"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Check Apple signing secrets for release builds
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [[ -n "$APPLE_CERTIFICATE_P12_BASE64" ]] || missing+=(APPLE_CERTIFICATE_P12_BASE64)
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -n "$MACOS_KEYCHAIN_PASSWORD" ]] || missing+=(MACOS_KEYCHAIN_PASSWORD)
          [[ -n "$APPLE_ID" ]] || missing+=(APPLE_ID)
          [[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] || missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=(APPLE_TEAM_ID)
          if (( ${#missing[@]} > 0 )); then
            printf '缺少 GitHub Actions Secrets：%s\n' "${missing[*]}" >&2
            echo "Release 需要 Developer ID 签名和 Apple 公证凭据。" >&2
            exit 1
          fi

      - name: Build app bundle
        run: bash build_app.sh

      - name: Sign app with Developer ID
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/screen-manager-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          APP_PATH="$GITHUB_WORKSPACE/build/屏幕管理.app"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "导入的证书中没有可用的 Developer ID Application 身份" >&2
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Build and verify DMG
        run: bash build_dmg.sh

      - name: Notarize and staple DMG
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="$GITHUB_WORKSPACE/build/屏幕管理.dmg"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Remove signing keychain
        if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        run: security delete-keychain "$RUNNER_TEMP/screen-manager-signing.keychain-db" || true

      - name: Upload app and DMG
        uses: actions/upload-artifact@v6
        with:
          name: Screen-Manager-macOS
          path: |
            build/屏幕管理.app
            build/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: Screen-Manager-macOS
          path: release-assets

      - name: Normalize DMG filename
        run: |
          dmg_path="$(find release-assets -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "构建产物中没有找到 DMG 文件" >&2
            exit 1
          fi
          target_path="release-assets/屏幕管理.dmg"
          if [[ "$dmg_path" != "$target_path" ]]; then
            mv "$dmg_path" "$target_path"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          TARGET: ${{ github.sha }}
        run: >-
          gh release create "$VERSION" "release-assets/屏幕管理.dmg"
          --repo "$REPOSITORY"
          --title "$VERSION"
          --target "$TARGET"
          --generate-notes
